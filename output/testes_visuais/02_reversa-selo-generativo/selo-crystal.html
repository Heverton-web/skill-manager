<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Selo: crystal-lattice</title><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a14}.label{color:#eaeaea;text-align:center;margin-top:12px;font-family:system-ui,sans-serif;font-size:12px}</style></head><body><div><div id="c"></div><div class="label">Selo · crystal-lattice</div></div><script>
const s=parseInt("a2b4c6d8e0f1",16);function setup(){createCanvas(400,400).parent('c');randomSeed(s);noiseSeed(s);noLoop()}
function draw(){background(10,10,20);const cx=width/2,cy=height/2

const pal=["#6c63ff","#00d4aa","#e0e0ff","#1a1a3a"];

}</script></body></html>
