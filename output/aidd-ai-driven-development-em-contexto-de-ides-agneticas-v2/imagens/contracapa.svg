<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" font-family="system-ui, sans-serif">
  <defs><linearGradient id="bgContra" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#0a0510"/></linearGradient></defs>
  <rect width="600" height="900" fill="url(#bgContra)"/>
  <text x="300" y="80" text-anchor="middle" fill="#e0e0ff" font-size="20" font-weight="bold">AIDD: AI-Driven Development</text>
  <text x="300" y="105" text-anchor="middle" fill="#8888bb" font-size="12">em Contexto de IDEs Agênticas</text>
  <line x1="100" y1="130" x2="500" y2="130" stroke="#6c63ff" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="170" text-anchor="middle" fill="#8888bb" font-size="11" font-weight="bold">SINOPSE</text>
  <text x="300" y="200" text-anchor="middle" fill="#7777aa" font-size="10" dx="-80">Este livro apresenta o paradigma AI-Driven Development (AIDD),</text>
  <text x="300" y="220" text-anchor="middle" fill="#7777aa" font-size="10" dx="-85">onde a inteligência artificial transita de ferramenta passiva</text>
  <text x="300" y="240" text-anchor="middle" fill="#7777aa" font-size="10" dx="-90">para agente ativo no ciclo de desenvolvimento de software.</text>
  <text x="300" y="270" text-anchor="middle" fill="#7777aa" font-size="10" dx="-80">Através de 4 capítulos, explore os fundamentos do AIDD, o</text>
  <text x="300" y="290" text-anchor="middle" fill="#7777aa" font-size="10" dx="-85">ecossistema de IDEs agênticas (Claude Code, Cursor, Windsurf),</text>
  <text x="300" y="310" text-anchor="middle" fill="#7777aa" font-size="10" dx="-90">o Model Context Protocol (MCP), e os padrões de orquestração</text>
  <text x="300" y="330" text-anchor="middle" fill="#7777aa" font-size="10" dx="-85">com sub-agentes paralelos — Spec-to-Code, auto-correção e</text>
  <text x="300" y="350" text-anchor="middle" fill="#7777aa" font-size="10" dx="-80">validação em loop fechado.</text>
  <line x1="100" y1="380" x2="500" y2="380" stroke="#6c63ff" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="420" text-anchor="middle" fill="#8888bb" font-size="11" font-weight="bold">TÓPICOS EM DESTAQUE</text>
  <text x="300" y="450" text-anchor="middle" fill="#6c63ff" font-size="10">● Specification-Driven Development</text>
  <text x="300" y="470" text-anchor="middle" fill="#6c63ff" font-size="10">● Ciclos de Auto-Correção Autônomos</text>
  <text x="300" y="490" text-anchor="middle" fill="#6c63ff" font-size="10">● Ecossistema Claude Code, Cursor e Windsurf</text>
  <text x="300" y="510" text-anchor="middle" fill="#6c63ff" font-size="10">● Model Context Protocol (MCP)</text>
  <text x="300" y="530" text-anchor="middle" fill="#6c63ff" font-size="10">● Orquestração com Sub-Agentes Paralelos</text>
  <text x="300" y="550" text-anchor="middle" fill="#6c63ff" font-size="10">● Segurança e Desafios do Desenvolvimento Agêntico</text>
  <line x1="100" y1="580" x2="500" y2="580" stroke="#6c63ff" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="850" text-anchor="middle" fill="#444466" font-size="9">FÁBRICA AGÊNTICA DE LIVROS · 2026</text>
</svg>