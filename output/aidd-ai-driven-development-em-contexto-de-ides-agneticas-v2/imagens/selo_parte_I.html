<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Selo: Parte I — Fundamentos do Desenvolvimento Orientado por IA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0a0a14; }
        #seal-container { display: block; }
        .label { color: #eaeaea; text-align: center; margin-top: 16px; font-family: system-ui, sans-serif; font-size: 14px; }
        .sub { color: #8888bb; text-align: center; font-family: system-ui, sans-serif; font-size: 11px; margin-top: 4px; }
    </style>
</head>
<body>
    <div>
        <div id="seal-container"></div>
        <div class="label">Parte I — Fundamentos do Desenvolvimento Orientado por IA</div>
        <div class="sub">seed: aidd-ai-driven-development-v2-parte-I • crystal-lattice</div>
    </div>
    <script id="seal-config" type="application/json">
        {"seed":"a2b4c6d8e0f102030405060708090a0b0c0d0e0f101112131415161718191a1b1c","paleta":["#6c63ff","#00d4aa","#1a1a3a","#e0e0ff"],"padrao":"crystal-lattice","tamanho":400}
    </script>
    <script>
        const config = JSON.parse(document.getElementById('seal-config').textContent);
        const seedInt = parseInt(config.seed.slice(0, 16), 16);
        const size = config.tamanho;
        const paleta = config.paleta;

        function setup() {
            const canvas = createCanvas(size, size);
            canvas.parent('seal-container');
            randomSeed(seedInt);
            noiseSeed(seedInt);
            noLoop();
        }

        function draw() {
            background(10, 10, 20);
            strokeWeight(1.5);
            const cx = width / 2, cy = height / 2;
            const layers = 8;

            for (let layer = 0; layer < layers; layer++) {
                const nVerts = 6 + layer * 2;
                const radius = 30 + layer * 22;
                const col = paleta[layer % paleta.length];
                stroke(col);
                fill(col + '22');

                beginShape();
                for (let i = 0; i <= nVerts; i++) {
                    const angle = (TWO_PI * i) / nVerts + random(-0.1, 0.1);
                    const r = radius + random(-8, 8);
                    const x = cx + cos(angle) * r;
                    const y = cy + sin(angle) * r;
                    vertex(x, y);
                }
                endShape(CLOSE);

                if (layer > 0) {
                    for (let i = 0; i < nVerts; i++) {
                        const a1 = (TWO_PI * i) / nVerts;
                        const a2 = (TWO_PI * (i + 1)) / nVerts;
                        const r1 = radius + random(-8, 8);
                        const r2 = radius + random(-8, 8);
                        const x1 = cx + cos(a1) * r1;
                        const y1 = cy + sin(a1) * r1;
                        const x2 = cx + cos(a2) * (radius - 15);
                        const y2 = cy + sin(a2) * (radius - 15);
                        line(x1, y1, x2, y2);
                    }
                }
            }

            fill(paleta[0]);
            noStroke();
            circle(cx, cy, 16);
        }
    </script>
</body>
</html>
