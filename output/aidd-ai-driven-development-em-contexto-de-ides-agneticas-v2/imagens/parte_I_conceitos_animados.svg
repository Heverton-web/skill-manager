<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#1a1a3a"/></linearGradient>
    <style>
      .node { fill: #2a2a5a; stroke: #6c63ff; stroke-width: 2; transition: all 0.3s; }
      .node:hover { fill: #3a3a7a; stroke: #00d4aa; }
      .label { fill: #e0e0ff; font-size: 13px; text-anchor: middle; }
      .sublabel { fill: #8888bb; font-size: 10px; text-anchor: middle; }
      .title { fill: #e0e0ff; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .edge { stroke: #555577; stroke-width: 1.5; stroke-dasharray: 6,3; }
      .draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2s ease forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse { 0%,100% { r: 12; } 50% { r: 16; } }
      .cap1 { animation: fadeIn 0.6s 0.3s both; }
      .cap2 { animation: fadeIn 0.6s 0.6s both; }
      .conn1 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1s 0.3s ease forwards; }
      .conn2 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1s 0.6s ease forwards; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .draw,.conn1,.conn2,.cap1,.cap2 { animation: none; stroke-dashoffset: 0; opacity: 1; } }
    </style>
  </defs>
  <rect width="700" height="500" fill="url(#bg)" rx="12"/>
  <text x="350" y="40" class="title">Parte I — Fundamentos do Desenvolvimento Orientado por IA</text>

  <circle cx="350" cy="180" r="14" fill="#6c63ff" opacity="0.3" class="pulse"/>
  <rect x="250" y="130" width="200" height="80" rx="12" class="node"/>
  <text x="350" y="165" class="label" font-weight="bold">Fundamentos AIDD</text>
  <text x="350" y="185" class="sublabel">Paradigma de Engenharia de Software</text>

  <rect x="80" y="310" width="220" height="90" rx="10" class="node cap1"/>
  <text x="190" y="345" class="label" font-weight="bold">Cap. 1 — Paradigma AIDD</text>
  <text x="190" y="365" class="sublabel">SDD + Auto-Correção + Novo Papel</text>
  <text x="190" y="385" class="sublabel">do Desenvolvedor</text>

  <rect x="400" y="310" width="220" height="90" rx="10" class="node cap2"/>
  <text x="510" y="345" class="label" font-weight="bold">Cap. 2 — Ecossistema de IDEs</text>
  <text x="510" y="365" class="sublabel">Claude Code + Cursor + Windsurf</text>
  <text x="510" y="385" class="sublabel">+ MCP + Open Source</text>

  <line x1="350" y1="210" x2="190" y2="310" stroke="#6c63ff" stroke-width="1.5" class="conn1"/>
  <line x1="350" y1="210" x2="510" y2="310" stroke="#00d4aa" stroke-width="1.5" class="conn2"/>

  <text x="350" y="480" class="sublabel">Diagrama Animado — Arquitetura Conceitual da Parte I</text>
</svg>