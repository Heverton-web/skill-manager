<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="system-ui, sans-serif">
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#1a1a3a"/></linearGradient></defs>
  <rect width="600" height="500" fill="url(#bg2)" rx="12"/>
  <text x="300" y="45" text-anchor="middle" fill="#e0e0ff" font-size="18" font-weight="bold">Ciclo de Auto-Correção Autônomo</text>
  <circle cx="300" cy="250" r="180" fill="none" stroke="#6c63ff" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="215" y="80" width="170" height="50" rx="25" fill="#3a2a7a" stroke="#6c63ff" stroke-width="2"/>
  <text x="300" y="110" text-anchor="middle" fill="#e0e0ff" font-size="13" font-weight="bold">1. Build</text>
  <rect x="400" y="225" width="170" height="50" rx="25" fill="#3a2a7a" stroke="#ff6b9d" stroke-width="2"/>
  <text x="485" y="255" text-anchor="middle" fill="#e0e0ff" font-size="13" font-weight="bold">5. Re-Teste</text>
  <rect x="215" y="370" width="170" height="50" rx="25" fill="#3a2a7a" stroke="#ffaa33" stroke-width="2"/>
  <text x="300" y="400" text-anchor="middle" fill="#e0e0ff" font-size="13" font-weight="bold">4. Patch</text>
  <rect x="30" y="225" width="170" height="50" rx="25" fill="#3a2a7a" stroke="#00d4aa" stroke-width="2"/>
  <text x="115" y="255" text-anchor="middle" fill="#e0e0ff" font-size="13" font-weight="bold">3. Análise</text>
  <circle cx="300" cy="110" r="10" fill="#6c63ff"/>
  <circle cx="485" cy="250" r="10" fill="#ff6b9d"/>
  <circle cx="300" cy="395" r="10" fill="#ffaa33"/>
  <circle cx="115" cy="250" r="10" fill="#00d4aa"/>
  <text x="390" y="170" fill="#6c63ff" font-size="11" text-anchor="middle">↓ erro</text>
  <text x="110" y="310" fill="#ff6b9d" font-size="11" text-anchor="middle">← falha</text>
  <text x="195" y="350" fill="#ffaa33" font-size="11" text-anchor="middle">↓ correção</text>
  <text x="390" y="310" fill="#00d4aa" font-size="11" text-anchor="middle">← stack trace</text>
  <text x="300" y="480" text-anchor="middle" fill="#555577" font-size="11">Diagrama 2 — Ciclo de Auto-Correção em 5 estágios</text>
</svg>