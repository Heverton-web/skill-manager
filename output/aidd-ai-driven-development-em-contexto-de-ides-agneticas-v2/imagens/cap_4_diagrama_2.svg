<rect x="470" y="80" width="200" height="135" rx="8" fill="#1a2a1a" stroke="#00d4aa" stroke-width="2"/>
<text x="570" y="120" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">Zona Restrita</text>
