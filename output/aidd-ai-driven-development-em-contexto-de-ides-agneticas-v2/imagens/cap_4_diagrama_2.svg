<text x="570" y="185" text-anchor="middle" fill="#8888bb" font-size="10">Audit trail</text>
<text x="350" y="330" text-anchor="middle" fill="#555577" font-size="11">4 camadas de segurança: permissões → sandbox → aprovação → detecção</text></svg>