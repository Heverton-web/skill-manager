<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="system-ui, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#1a0a0a"/></linearGradient></defs>
<rect width="700" height="350" fill="url(#bg)" rx="12"/>
<text x="350" y="35" text-anchor="middle" fill="#e0e0ff" font-size="16" font-weight="bold">Camadas de Segurança para Agentes Autônomos</text>
<rect x="30" y="80" width="200" height="60" rx="8" fill="#2a1a1a" stroke="#ff6b9d" stroke-width="1.5"/>
<text x="130" y="108" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">Nível 1: Comandos</text>
<text x="130" y="126" text-anchor="middle" fill="#8888bb" font-size="10">Lista de permissão</text>
<rect x="30" y="155" width="200" height="60" rx="8" fill="#2a1a1a" stroke="#ff6b9d" stroke-width="1.5"/>
<text x="130" y="183" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">Nível 2: Containers</text>
<text x="130" y="201" text-anchor="middle" fill="#8888bb" font-size="10">Sandboxing Docker</text>
<rect x="250" y="80" width="200" height="60" rx="8" fill="#1a1a2a" stroke="#ffaa33" stroke-width="1.5"/>
<text x="350" y="108" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">Nível 3: Aprovação</text>
