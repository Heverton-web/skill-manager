<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#1a0a0a"/></linearGradient>
    <style>
      .node { fill: #2a1a2a; stroke: #ff6b9d; stroke-width: 2; transition: all 0.3s; }
      .node:hover { fill: #3a2a3a; stroke: #ffaa33; }
      .label { fill: #e0e0ff; font-size: 13px; text-anchor: middle; }
      .sublabel { fill: #8888bb; font-size: 10px; text-anchor: middle; }
      .title { fill: #e0e0ff; font-size: 18px; font-weight: bold; text-anchor: middle; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
      @keyframes pulse { 0%,100% { r: 12; } 50% { r: 16; } }
      .cap3 { animation: fadeIn 0.6s 0.3s both; }
      .cap4 { animation: fadeIn 0.6s 0.6s both; }
      .cn1 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1s 0.3s ease forwards; }
      .cn2 { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1s 0.6s ease forwards; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cn1,.cn2,.cap3,.cap4 { animation: none; stroke-dashoffset: 0; opacity: 1; } }
    </style>
  </defs>
  <rect width="700" height="500" fill="url(#bg2)" rx="12"/>
  <text x="350" y="40" class="title">Parte II — Fluxos, Ferramentas e Práticas de AIDD</text>
  <circle cx="350" cy="175" r="14" fill="#ff6b9d" opacity="0.3" class="pulse"/>
  <rect x="250" y="125" width="200" height="80" rx="12" class="node"/>
  <text x="350" y="160" class="label" font-weight="bold">Práticas AIDD</text>
  <text x="350" y="180" class="sublabel">Pipelines e Orquestração</text>
  <rect x="80" y="310" width="220" height="90" rx="10" class="node cap3"/>
  <text x="190" y="345" class="label" font-weight="bold">Cap. 3 — Spec-to-Code</text>
  <text x="190" y="365" class="sublabel">Sub-Agentes + Validação</text>
  <text x="190" y="385" class="sublabel">+ Revisão Humana</text>
  <rect x="400" y="310" width="220" height="90" rx="10" class="node cap4"/>
  <text x="510" y="345" class="label" font-weight="bold">Cap. 4 — Desafios e Futuro</text>
  <text x="510" y="365" class="sublabel">Alucinação + Segurança</text>
  <text x="510" y="385" class="sublabel">+ Agentes Especialistas</text>
  <line x1="350" y1="205" x2="190" y2="310" stroke="#ff6b9d" stroke-width="1.5" class="cn1"/>
  <line x1="350" y1="205" x2="510" y2="310" stroke="#ffaa33" stroke-width="1.5" class="cn2"/>
  <text x="350" y="480" class="sublabel">Diagrama Animado — Arquitetura Conceitual da Parte II</text>
</svg>