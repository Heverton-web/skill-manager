<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" font-family="system-ui, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a0a1a"/><stop offset="100%" stop-color="#0a1a1a"/></linearGradient></defs>
  <rect width="750" height="350" fill="url(#bg)" rx="12"/>
  <text x="375" y="35" text-anchor="middle" fill="#e0e0ff" font-size="16" font-weight="bold">Roadmap da Evolução do AIDD</text>
  <line x1="80" y1="100" x2="680" y2="100" stroke="#6c63ff" stroke-width="2"/>
  <circle cx="150" cy="100" r="12" fill="#6c63ff"/>
  <text x="150" y="140" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">2022-2024</text>
  <text x="150" y="160" text-anchor="middle" fill="#8888bb" font-size="10">Assistentes</text>
  <text x="150" y="175" text-anchor="middle" fill="#8888bb" font-size="10">Chat + Autocomplete</text>
  <circle cx="375" cy="100" r="12" fill="#00d4aa"/>
  <text x="375" y="140" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">2024-2026</text>
  <text x="375" y="160" text-anchor="middle" fill="#8888bb" font-size="10">IDEs Agênticas</text>
  <text x="375" y="175" text-anchor="middle" fill="#8888bb" font-size="10">MCP + Subagentes</text>
  <circle cx="600" cy="100" r="12" fill="#ffaa33"/>
  <text x="600" y="140" text-anchor="middle" fill="#e0e0ff" font-size="12" font-weight="bold">2026+</text>
  <text x="600" y="160" text-anchor="middle" fill="#8888bb" font-size="10">Agentes Especialistas</text>
  <text x="600" y="175" text-anchor="middle" fill="#8888bb" font-size="10">MCP Padrão Industrial</text>
  <text x="375" y="330" text-anchor="middle" fill="#555577" font-size="11">Roadmap: Assistentes → Agentes → Especialistas</text>
</svg>