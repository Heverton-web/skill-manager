<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Selo: Parte II — Fluxos, Ferramentas e Práticas de AIDD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0a0a14}#seal-container{display:block}.label{color:#eaeaea;text-align:center;margin-top:16px;font-family:system-ui,sans-serif;font-size:14px}.sub{color:#8888bb;text-align:center;font-family:system-ui,sans-serif;font-size:11px;margin-top:4px}</style></head>
<body><div><div id="seal-container"></div><div class="label">Parte II — Fluxos, Ferramentas e Práticas de AIDD</div><div class="sub">seed: aidd-v2-parte-II • particle-orbit</div></div>
<script id="seal-config" type="application/json">{"seed":"f1e2d3c4b5a69788796a5b4c3d2e1f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6","paleta":["#ff6b9d","#ffaa33","#1a0a0a","#e0e0ff"],"padrao":"particle-orbit","tamanho":400}</script>
<script>
const c=JSON.parse(document.getElementById('seal-config').textContent);
const s=parseInt(c.seed.slice(0,16),16),sz=c.tamanho,p=c.paleta;
function setup(){createCanvas(sz,sz).parent('seal-container');randomSeed(s);noiseSeed(s);noLoop()}
function draw(){background(10,10,20);const cx=width/2,cy=height/2;const n=80;
for(let i=0;i<n;i++){const a=random(TWO_PI),r=random(20,180),sp=random(0.5,2);
const x=cx+cos(a+sp)*r,y=cy+sin(a+sp)*r;const col=p[i%p.length];
const trail=random(3,8);stroke(col+'44');strokeWeight(1);noFill();
beginShape();for(let t=0;t<trail;t++){const ta=a+sp-t*0.05;const tr=r+random(-10,10);
vertex(cx+cos(ta)*tr,cy+sin(ta)*tr)}endShape();
fill(col);noStroke();circle(x,y,random(2,5))}
stroke(p[0]+'66');noFill();for(let i=0;i<3;i++){circle(cx,cy,80+i*50)}
}</script></body></html>
