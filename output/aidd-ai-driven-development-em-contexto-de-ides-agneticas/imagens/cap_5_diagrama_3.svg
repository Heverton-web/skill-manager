  <text x="600" y="300" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Toda intera&ccedil;&atilde;o &eacute; versionada: spec, c&oacute;digo, testes &mdash; tudo no mesmo reposit&oacute;rio</text>
