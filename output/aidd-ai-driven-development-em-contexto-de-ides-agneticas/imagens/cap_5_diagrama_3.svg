  <text x="670" y="118" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">humano</text>
  <line x1="740" y1="105" x2="780" y2="105" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaS)"/>
