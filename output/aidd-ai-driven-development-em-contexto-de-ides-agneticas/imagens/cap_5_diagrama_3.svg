  <text x="310" y="118" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">implementa</text>
  <line x1="380" y1="105" x2="420" y2="105" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaS)"/>
  <rect x="420" y="70" width="140" height="70" rx="8" fill="#2a5a7a"/>
  <text x="490" y="100" font-size="12" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">CI Valida</text>
  <text x="490" y="118" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">ader&ecirc;ncia &agrave; spec</text>
  <line x1="560" y1="105" x2="600" y2="105" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaS)"/>
  <rect x="600" y="70" width="140" height="70" rx="8" fill="#3a4a5a"/>
