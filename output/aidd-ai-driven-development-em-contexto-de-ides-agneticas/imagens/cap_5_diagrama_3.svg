  <text x="130" y="118" font-size="10" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">Revis&atilde;o humana</text>
  <line x1="200" y1="105" x2="240" y2="105" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaS)"/>
