  </defs>
  <rect x="0" y="0" width="1200" height="350" fill="#0f1720"/>
  <text x="600" y="35" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Fluxo SDD no Pipeline de Desenvolvimento</text>
  <rect x="60" y="70" width="140" height="70" rx="8" fill="#e8b94a" opacity="0.9"/>
