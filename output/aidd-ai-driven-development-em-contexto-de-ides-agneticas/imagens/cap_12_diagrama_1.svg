  <text x="200" y="350" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Equipes -30-50%</text>
  <text x="200" y="370" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Eng. intenção dominante</text>
  <text x="200" y="390" font-size="10" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Mais provável</text>
  <rect x="360" y="300" width="280" height="110" rx="8" fill="#1c2a3a" stroke="#e8b94a" stroke-width="1"/>
  <text x="500" y="325" font-size="13" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Cenário 2: Substituição</text>
