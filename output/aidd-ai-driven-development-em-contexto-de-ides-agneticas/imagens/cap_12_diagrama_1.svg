  <text x="500" y="390" font-size="10" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Possível</text>
  <rect x="660" y="300" width="280" height="110" rx="8" fill="#1c2a3a" stroke="#e85a5a" stroke-width="1"/>
  <text x="800" y="325" font-size="13" font-family="Georgia, serif" font-weight="bold" fill="#e85a5a" text-anchor="middle">Cenário 3: Estagnação</text>
  <text x="800" y="350" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Bolha estoura</text>
