  <text x="730" y="170" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Debugging estrat&eacute;gico</text>
  <text x="730" y="190" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Projeta evals para agentes</text>

  <text x="500" y="275" font-size="14" font-family="Georgia, serif" fill="#e8b94a" text-anchor="middle">Cenários para 2028-2030</text>
  <rect x="60" y="300" width="280" height="110" rx="8" fill="#1c2a3a" stroke="#4a8a4a" stroke-width="1"/>
