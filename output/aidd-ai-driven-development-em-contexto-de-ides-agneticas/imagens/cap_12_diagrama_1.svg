  <text x="270" y="170" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Debugging linha a linha</text>
  <text x="270" y="190" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Memoriza APIs e frameworks</text>
  <rect x="520" y="70" width="420" height="160" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
