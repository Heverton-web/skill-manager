<svg viewBox="0 0 1000 450" width="1000" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1000" height="450" fill="#0f1720"/>
  <text x="500" y="35" font-size="20" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Evolução dos Perfis na Engenharia de Software</text>
  <rect x="60" y="70" width="420" height="160" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
