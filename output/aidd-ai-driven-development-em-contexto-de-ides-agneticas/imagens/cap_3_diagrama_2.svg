<svg viewBox="0 0 1200 550" width="1200" height="550" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="550" fill="#0f1720"/>
  <text x="600" y="45" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">O Funil Invertido: Gera&ccedil;&atilde;o vs. Revis&atilde;o de C&oacute;digo</text>

  <!-- Lado esquerdo: Antes -->
  <text x="300" y="85" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Antes dos Coding Agents</text>
  
  <!-- Funil normal -->
  <polygon points="180,120 420,120 360,200 240,200" fill="#2a5a7a" opacity="0.8"/>
  <text x="300" y="170" font-size="13" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">Implementa&ccedil;&atilde;o</text>
  <text x="300" y="190" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(dev escreve)</text>
  
  <polygon points="240,220 360,220 330,280 270,280" fill="#3a4a5a"/>
  <text x="300" y="258" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Revis&atilde;o</text>
  
  <polygon points="270,300 330,300 310,340 290,340" fill="#3a4a5a"/>
  <text x="300" y="328" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Deploy</text>

  <text x="300" y="390" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Funil normal: implementa&ccedil;&atilde;o &eacute;</text>
  <text x="300" y="410" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">o gargalo natural</text>

  <!-- Setas de transição -->
  <text x="540" y="220" font-size="28" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">&rarr;</text>
  <text x="540" y="260" font-size="14" font-family="Georgia, serif" fill="#e8b94a" text-anchor="middle">Agentes</text>
  <text x="540" y="280" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">aceleram</text>
  <text x="540" y="300" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">~100x</text>

  <!-- Lado direito: Depois -->
  <text x="860" y="85" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Com Coding Agents</text>
  
  <polygon points="780,120 940,120 880,160 840,160" fill="#e8b94a" opacity="0.8"/>
  <text x="860" y="148" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">Gera&ccedil;&atilde;o (agente)</text>
  <text x="860" y="168" font-size="11" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">segundos/minutos</text>

  <!-- Review bottleneck -->
  <polygon points="740,180 980,180 920,280 800,280" fill="#2a5a7a"/>
  <text x="860" y="240" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">REVIS&Atilde;O</text>
  <text x="860" y="260" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(tempo +90%)</text>
  
  <polygon points="800,300 920,300 880,360 840,360" fill="#3a4a5a"/>
  <text x="860" y="338" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Deploy</text>

  <text x="860" y="390" font-size="12" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">Funil invertido: revis&atilde;o &eacute;</text>
  <text x="860" y="410" font-size="12" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">o NOVO gargalo</text>

  <!-- Consequências -->
  <rect x="60" y="440" width="1080" height="90" rx="8" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <text x="600" y="465" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Consequ&ecirc;ncias do Review Bottleneck</text>
  <text x="250" y="495" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">PRs acumulam sem revis&atilde;o</text>
  <text x="500" y="495" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Revis&otilde;es superficiais</text>
  <text x="750" y="495" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Maior change failure rate</text>
  <text x="960" y="495" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">D&iacute;vida t&eacute;cnica acelera</text>
</svg>