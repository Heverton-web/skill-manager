<svg viewBox="0 0 1200 600" width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="600" fill="#0f1720"/>
  <text x="600" y="40" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Os 6 Elementos de uma Especifica&ccedil;&atilde;o Execut&aacute;vel</text>
  <rect x="60" y="70" width="340" height="150" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="230" y="100" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">1. Outcomes</text>
  <text x="230" y="125" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Resultados esperados observ&aacute;veis</text>
  <text x="230" y="145" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"Endpoint retorna 200 com array"</text>
  <text x="80" y="175" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="start">Crit&eacute;rio de sucesso mensur&aacute;vel</text>
  <rect x="430" y="70" width="340" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="600" y="100" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">2. Scope Boundaries</text>
  <text x="600" y="125" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Dentro vs. Fora do escopo</text>
  <text x="600" y="145" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"Dentro: CRUD. Fora: auth."</text>
  <text x="450" y="175" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="start">Previne desvios (scope creep)</text>
  <rect x="800" y="70" width="340" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="970" y="100" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">3. Constraints</text>
  <text x="970" y="125" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Restri&ccedil;&otilde;es e premissas</text>
  <text x="970" y="145" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"PostgreSQL + Prisma + React"</text>
  <text x="820" y="175" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="start">Stack, APIs, limita&ccedil;&otilde;es</text>
  <rect x="60" y="250" width="340" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="230" y="280" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">4. Prior Decisions</text>
  <text x="230" y="305" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Decis&otilde;es j&aacute; travadas</text>
  <text x="230" y="325" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"Repository pattern + Vitest"</text>
  <text x="80" y="355" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="start">Evita reinven&ccedil;&atilde;o de rodas</text>
  <rect x="430" y="250" width="340" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="600" y="280" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">5. Task Breakdown</text>
  <text x="600" y="305" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Decomposi&ccedil;&atilde;o granular</text>
  <text x="600" y="325" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Tarefas sequenciais verific&aacute;veis</text>
  <text x="450" y="355" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="start">Agente executa passo a passo</text>
  <rect x="800" y="250" width="340" height="150" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="970" y="280" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">6. Verification</text>
  <text x="970" y="305" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Crit&eacute;rios de verifica&ccedil;&atilde;o</text>
  <text x="970" y="325" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"Coverage 80%, lint sem erros"</text>
  <text x="820" y="355" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="start">Como provar que est&aacute; pronto</text>
  <text x="600" y="460" font-size="14" font-family="Georgia, serif" fill="#e8b94a" text-anchor="middle">Spec boa = precisa + inequ&iacute;voca + verific&aacute;vel</text>
  <text x="600" y="490" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">N&atilde;o &eacute; sobre ser longa &mdash; &eacute; sobre ser precisa</text>
  <text x="600" y="520" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Uma spec de 10 linhas bem escritas vale mais que 100 p&aacute;ginas de documento de requisitos</text>
</svg>