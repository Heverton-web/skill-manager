<svg viewBox="0 0 1200 600" width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tradGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2a3a"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="aiddGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <marker id="setaDir" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e8b94a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#0f1720"/>
  <text x="600" y="40" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Contraste: Ciclo Tradicional vs. Ciclo AIDD</text>

  <!-- Ciclo Tradicional -->
  <rect x="40" y="65" width="540" height="240" rx="12" fill="url(#tradGrad)" stroke="#3a4a5a" stroke-width="2"/>
  <text x="310" y="95" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Ciclo Tradicional</text>
  <rect x="70" y="120" width="130" height="50" rx="8" fill="#3a4a5a"/>
  <text x="135" y="150" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Especifica&ccedil;&atilde;o</text>
  <text x="135" y="166" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">(ticket JIRA 3 linhas)</text>
  <line x1="200" y1="145" x2="240" y2="145" stroke="#3a4a5a" stroke-width="2" marker-end="url(#setaDir)"/>
  <rect x="240" y="120" width="140" height="50" rx="8" fill="#2a5a7a"/>
  <text x="310" y="145" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Implementa&ccedil;&atilde;o</text>
  <text x="310" y="166" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(dias ou semanas)</text>
  <line x1="380" y1="145" x2="420" y2="145" stroke="#3a4a5a" stroke-width="2" marker-end="url(#setaDir)"/>
  <rect x="420" y="120" width="130" height="50" rx="8" fill="#3a4a5a"/>
  <text x="485" y="145" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Teste</text>
  <text x="485" y="166" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">(manual ou automatizado)</text>
  <text x="310" y="220" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">C&oacute;digo &eacute; a &uacute;nica fonte da verdade</text>
  <text x="310" y="240" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Gargalo: execu&ccedil;&atilde;o (escrever c&oacute;digo)</text>
  <text x="310" y="260" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Dev &eacute; construtor manual</text>
  <text x="310" y="285" font-size="11" font-family="Arial, sans-serif" fill="#3a4a5a" text-anchor="middle">50% do tempo em implementa&ccedil;&atilde;o</text>

  <!-- Seta de transição -->
  <text x="600" y="200" font-size="28" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">&darr;</text>
  <line x1="580" y1="250" x2="580" y2="360" stroke="#e8b94a" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="620" y="300" font-size="14" font-family="Georgia, serif" fill="#e8b94a" text-anchor="middle">Mudan&ccedil;a de Paradigma</text>
  <text x="620" y="320" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Agentes aut&ocirc;nomos</text>

  <!-- Ciclo AIDD -->
  <rect x="40" y="340" width="1120" height="240" rx="12" fill="url(#aiddGrad)" stroke="#e8b94a" stroke-width="2"/>
  <text x="600" y="370" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Ciclo AIDD</text>
  <rect x="70" y="400" width="160" height="60" rx="8" fill="#e8b94a" opacity="0.9"/>
  <text x="150" y="430" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">Inten&ccedil;&atilde;o detalhada</text>
  <text x="150" y="448" font-size="11" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">(especifica&ccedil;&atilde;o estruturada)</text>
  <line x1="230" y1="430" x2="270" y2="430" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaDir)"/>
  <rect x="270" y="400" width="160" height="60" rx="8" fill="#1c2a3a" stroke="#e8b94a" stroke-width="1"/>
  <text x="350" y="430" font-size="13" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">Agente implementa</text>
  <text x="350" y="448" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(loops edit-test-fix)</text>
  <line x1="430" y1="430" x2="470" y2="430" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaDir)"/>
  <rect x="470" y="400" width="160" height="60" rx="8" fill="#3a4a5a"/>
  <text x="550" y="430" font-size="13" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">Verifica&ccedil;&atilde;o adversarial</text>
  <text x="550" y="448" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(humano valida)</text>
  <line x1="630" y1="415" x2="670" y2="385" stroke="#e8b94a" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#setaDir)"/>
  <text x="680" y="395" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="start">n&atilde;o ok</text>
  <line x1="630" y1="445" x2="670" y2="475" stroke="#4a8a4a" stroke-width="2" marker-end="url(#setaDir)"/>
  <text x="680" y="480" font-size="10" font-family="Arial, sans-serif" fill="#4a8a4a" text-anchor="start">ok</text>
  <rect x="670" y="475" width="100" height="40" rx="8" fill="#4a8a4a"/>
  <text x="720" y="500" font-size="12" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Entrega</text>

  <text x="600" y="530" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Especifica&ccedil;&atilde;o &eacute; a fonte da verdade &bull; Gargalo: clareza da inten&ccedil;&atilde;o &bull; Dev &eacute; arquiteto de inten&ccedil;&atilde;o</text>
  <text x="600" y="555" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">55% do tempo em planejamento/especifica&ccedil;&atilde;o &bull; 20% em implementa&ccedil;&atilde;o (agente faz)</text>
</svg>