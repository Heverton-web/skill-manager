<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="setaF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e8b94a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="500" fill="#0f1720"/>
  <text x="500" y="35" font-size="20" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Fable Method: Think, Act, Prove</text>
  <rect x="350" y="60" width="300" height="50" rx="25" fill="#e8b94a" opacity="0.9"/>
  <text x="500" y="90" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">1. Classify (Think)</text>
  <text x="500" y="108" font-size="10" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">Question / Task / Plan-First</text>
  <line x1="500" y1="110" x2="500" y2="140" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaF)"/>
  <rect x="300" y="140" width="400" height="50" rx="8" fill="#1c2a3a" stroke="#b9c2cc" stroke-width="1"/>
  <text x="500" y="165" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">2. Define Done (Think)</text>
  <text x="500" y="183" font-size="10" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"O endpoint retorna 200 com array de usu&aacute;rios no banco de teste"</text>
  <line x1="500" y1="190" x2="500" y2="220" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaF)"/>
  <rect x="250" y="220" width="500" height="50" rx="8" fill="#2a5a7a"/>
  <text x="500" y="245" font-size="14" font-family="Arial, sans-serif" style="font-weight:bold" fill="#f5f2ea" text-anchor="middle">3. Gather Evidence (Think)</text>
  <text x="500" y="263" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Ler c&oacute;digo real &bull; Verificar testes existentes &bull; Consultar schemas e tipos</text>
  <line x1="500" y1="270" x2="500" y2="300" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaF)"/>
  <rect x="300" y="300" width="400" height="50" rx="8" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="500" y="325" font-size="14" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">4. Commit + Act (Act)</text>
  <text x="500" y="343" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">INTENT: declara&ccedil;&atilde;o de inten&ccedil;&atilde;o &bull; AUTH: autoriza&ccedil;&atilde;o expl&iacute;cita</text>
  <line x1="500" y1="350" x2="500" y2="380" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaF)"/>
  <rect x="250" y="380" width="500" height="50" rx="25" fill="#e85a5a" opacity="0.9"/>
  <text x="500" y="408" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">5. Verify / Prove</text>
  <text x="500" y="426" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">fable-judge: VERIFIED / VERIFIED WITH CAVEATS / REFUTED</text>
  <text x="500" y="480" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Cada passo verifica o anterior &mdash; detec&ccedil;&atilde;o precoce de reward hacking</text>
</svg>