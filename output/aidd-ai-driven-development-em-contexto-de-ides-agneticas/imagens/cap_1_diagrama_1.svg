<svg viewBox="0 0 1200 600" width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e8b94a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="600" fill="#0f1720"/>
  <text x="600" y="50" font-size="24" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Evolu&ccedil;&atilde;o do Desenvolvimento de Software</text>
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#e8b94a" stroke-width="3"/>
  <!-- Era 1: Mainframes -->
  <line x1="110" y1="280" x2="110" y2="310" stroke="#3a4a5a" stroke-width="2"/>
  <rect x="40" y="100" width="140" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="110" y="130" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">1960-1980</text>
  <text x="110" y="158" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Mainframes</text>
  <text x="110" y="180" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Cart&otilde;es perfurados</text>
  <text x="110" y="198" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Batch processing</text>
  <text x="110" y="216" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">COBOL, FORTRAN</text>
  <text x="110" y="240" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Gargalo: hardware</text>
  <text x="110" y="320" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Execution bottleneck</text>
  <!-- Seta 1 -->
  <line x1="180" y1="200" x2="240" y2="200" stroke="#e8b94a" stroke-width="3" marker-end="url(#seta)"/>
  <!-- Era 2: IDEs -->
  <line x1="340" y1="280" x2="340" y2="310" stroke="#3a4a5a" stroke-width="2"/>
  <rect x="260" y="100" width="160" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="340" y="130" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">1990-2010</text>
  <text x="340" y="158" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">IDEs Modernas</text>
  <text x="340" y="180" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Eclipse, VS, IntelliJ</text>
  <text x="340" y="198" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Autocompletar</text>
  <text x="340" y="216" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Refatora&ccedil;&atilde;o autom&aacute;tica</text>
  <text x="340" y="240" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Ferramenta passiva</text>
  <text x="340" y="320" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">C&oacute;digo = fonte da verdade</text>
  <!-- Seta 2 -->
  <line x1="420" y1="200" x2="480" y2="200" stroke="#e8b94a" stroke-width="3" marker-end="url(#seta)"/>
  <!-- Era 3: Assistentes -->
  <line x1="580" y1="280" x2="580" y2="310" stroke="#3a4a5a" stroke-width="2"/>
  <rect x="500" y="100" width="160" height="150" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="580" y="130" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">2021-2024</text>
  <text x="580" y="158" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Assistentes de IA</text>
  <text x="580" y="180" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">GitHub Copilot</text>
  <text x="580" y="198" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Autocomplete + Chat</text>
  <text x="580" y="216" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Sugest&atilde;o de bloco</text>
  <text x="580" y="240" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Dev ainda implementa</text>
  <!-- Seta 3 -->
  <line x1="660" y1="200" x2="720" y2="200" stroke="#e8b94a" stroke-width="3" marker-end="url(#seta)"/>
  <!-- Era 4: Agentes -->
  <line x1="820" y1="280" x2="820" y2="310" stroke="#3a4a5a" stroke-width="2"/>
  <rect x="740" y="100" width="160" height="150" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="820" y="130" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">2024-2026</text>
  <text x="820" y="158" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Agentes Aut&ocirc;nomos</text>
  <text x="820" y="180" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Claude Code, Cursor</text>
  <text x="820" y="198" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Cline, Aider, Devin</text>
  <text x="820" y="216" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Loops aut&ocirc;nomos</text>
  <text x="820" y="240" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">Spec = fonte da verdade</text>
  <!-- Linha de autonomia -->
  <text x="600" y="380" font-size="14" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&iacute;vel de Autonomia do Desenvolvedor &rarr;</text>
  <rect x="80" y="400" width="1040" height="6" rx="3" fill="#1c2a3a"/>
  <rect x="80" y="400" width="260" height="6" rx="3" fill="#e8b94a"/>
  <text x="210" y="430" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Baixa autonomia (dev implementa)</text>
  <rect x="860" y="400" width="260" height="6" rx="3" fill="#e8b94a"/>
  <text x="990" y="430" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Alta autonomia (agente implementa)</text>
  <!-- Legenda -->
  <text x="600" y="500" font-size="14" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Cada era transfere mais responsabilidade de implementa&ccedil;&atilde;o para a m&aacute;quina</text>
  <text x="600" y="530" font-size="14" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">A especifica&ccedil;&atilde;o substitui o c&oacute;digo como fonte da verdade</text>
</svg>