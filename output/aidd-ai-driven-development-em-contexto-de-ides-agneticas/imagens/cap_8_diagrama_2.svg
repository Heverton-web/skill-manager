<svg viewBox="0 0 1000 400" width="1000" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="setaV" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8b94a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="400" fill="#0f1720"/>
  <text x="500" y="35" font-size="18" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Fluxo de Ciclo Autônomo com Verificação Adversarial</text>
  <rect x="60" y="70" width="200" height="60" rx="10" fill="#e8b94a" opacity="0.9"/>
  <text x="160" y="100" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">1. Escrever Teste</text>
  <text x="160" y="118" font-size="10" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">(humano ou agente)</text>
  <line x1="260" y1="100" x2="300" y2="100" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaV)"/>
  <rect x="300" y="70" width="200" height="60" rx="8" fill="#1c2a3a" stroke="#b9c2cc" stroke-width="1"/>
  <text x="400" y="100" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">2. Implementar</text>
  <text x="400" y="118" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(agente codifica)</text>
  <line x1="500" y1="100" x2="540" y2="100" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaV)"/>
  <rect x="540" y="70" width="200" height="60" rx="8" fill="#2a5a7a"/>
  <text x="640" y="100" font-size="13" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">3. Rodar Testes</text>
  <text x="640" y="118" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">(automático)</text>
  <line x1="740" y1="100" x2="780" y2="100" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaV)"/>
  <rect x="780" y="70" width="160" height="60" rx="10" fill="#4a8a4a"/>
  <text x="860" y="95" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Passou?</text>
  <!-- Loop de falha -->
  <path d="M 860,130 L 860,200 L 400,200 L 400,130" fill="none" stroke="#e85a5a" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#setaV)"/>
  <text x="630" y="215" font-size="11" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">N&atilde;o: corrige e volta (Test-Driven Repair)</text>
  <!-- Verificação adversarial -->
  <rect x="300" y="250" width="400" height="50" rx="10" fill="#e85a5a" opacity="0.2" stroke="#e85a5a" stroke-width="2"/>
  <text x="500" y="275" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#e85a5a" text-anchor="middle">4. Verifica&ccedil;&atilde;o Adversarial (fable-judge)</text>
  <text x="500" y="295" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Testes enfraquecidos? &bull; Diffs n&atilde;o declarados? &bull; Casos de borda?</text>
  <line x1="700" y1="275" x2="780" y2="275" stroke="#e85a5a" stroke-width="2" marker-end="url(#setaV)"/>
  <rect x="780" y="250" width="160" height="50" rx="10" fill="#4a8a4a"/>
  <text x="860" y="275" font-size="13" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">VERIFIED</text>
  <text x="860" y="293" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">ou REFUTED</text>
</svg>