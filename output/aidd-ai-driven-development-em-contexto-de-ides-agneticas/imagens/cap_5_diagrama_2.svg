<svg viewBox="0 0 1200 400" width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="400" fill="#0f1720"/>
  <text x="600" y="40" font-size="20" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">N&iacute;veis de Rigor do Spec-Driven Development</text>
  <line x1="100" y1="250" x2="1100" y2="250" stroke="#3a4a5a" stroke-width="4"/>
  <text x="600" y="285" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Rigor &larr;&rarr;</text>
  <rect x="80" y="100" width="280" height="130" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="220" y="130" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Spec-First</text>
  <text x="220" y="155" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Spec guia o agente inicialmente</text>
  <text x="220" y="175" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&atilde;o mantida como doc viva</text>
  <text x="220" y="195" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Prototipa&ccedil;&atilde;o r&aacute;pida</text>
  <polygon points="360,165 400,130 400,200" fill="#3a4a5a"/>
  <rect x="460" y="100" width="280" height="130" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="600" y="130" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Spec-Anchored</text>
  <text x="600" y="155" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Spec sincronizada com c&oacute;digo</text>
  <text x="600" y="175" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Testes validam ader&ecirc;ncia</text>
  <text x="600" y="195" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">BDD para agentes</text>
  <polygon points="740,165 780,130 780,200" fill="#3a4a5a"/>
  <rect x="840" y="100" width="280" height="130" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="980" y="130" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Spec-As-Source</text>
  <text x="980" y="155" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Spec &eacute; o c&oacute;digo-fonte</text>
  <text x="980" y="175" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Edi&ccedil;&atilde;o manual proibida</text>
  <text x="980" y="195" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Sistemas cr&iacute;ticos</text>
  <text x="600" y="340" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Escolha o n&iacute;vel conforme a criticidade do projeto e a maturidade da equipe</text>
  <text x="600" y="365" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&atilde;o h&aacute; n&iacute;vel "certo" &mdash; h&aacute; o n&iacute;vel adequado para seu contexto</text>
</svg>