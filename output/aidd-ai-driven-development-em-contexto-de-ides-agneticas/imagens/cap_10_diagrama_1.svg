<svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="500" fill="#0f1720"/>
  <text x="600" y="35" font-size="20" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Adoção Corporativa de Coding Agents (2026)</text>
  <text x="200" y="75" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Taxa em Produção por Setor</text>
  <rect x="80" y="100" width="200" height="30" rx="4" fill="#e8b94a" opacity="0.9"/>
  <text x="180" y="120" font-size="12" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">Banking/Seguros (47%)</text>
  <rect x="80" y="140" width="180" height="30" rx="4" fill="#e8b94a" opacity="0.8"/>
  <text x="170" y="160" font-size="12" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">Software/Internet (44%)</text>
  <rect x="80" y="180" width="70" height="30" rx="4" fill="#2a5a7a"/>
  <text x="115" y="200" font-size="12" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">Sa&uacute;de (18%)</text>
  <rect x="80" y="220" width="60" height="30" rx="4" fill="#3a4a5a"/>
  <text x="110" y="240" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">P&uacute;b. (14%)</text>
  <text x="500" y="75" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e85a5a" text-anchor="middle">88% dos Pilotos FALHAM</text>
  <rect x="500" y="100" width="300" height="30" rx="4" fill="#3a1a1a" stroke="#e85a5a" stroke-width="1"/>
  <text x="650" y="120" font-size="12" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">64%: Falta de evals</text>
  <rect x="500" y="140" width="240" height="30" rx="4" fill="#3a1a1a" stroke="#e85a5a" stroke-width="1"/>
  <text x="620" y="160" font-size="12" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">57%: Governan&ccedil;a</text>
  <rect x="500" y="180" width="220" height="30" rx="4" fill="#3a1a1a" stroke="#e85a5a" stroke-width="1"/>
  <text x="610" y="200" font-size="12" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">51%: Não-determinismo</text>
  <text x="1020" y="75" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#4a8a4a" text-anchor="middle">ROI Real</text>
  <text x="1020" y="110" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">7-9h/semana</text>
  <text x="1020" y="135" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">30-50% + features</text>
  <text x="1020" y="160" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">20-30% - bugs</text>
  <text x="1020" y="185" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">+25 NPS dev</text>
  <text x="600" y="340" font-size="14" font-family="Georgia, serif" fill="#e8b94a" text-anchor="middle">O sucesso do AIDD não está nos agentes &mdash; está na infraestrutura ao redor deles</text>
  <text x="600" y="370" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Evals &bull; Determinismo &bull; Governança &bull; HITL &bull; MCPs internos &bull; Modelos locais</text>
  <text x="600" y="400" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&atilde;o pergunte "o agente funciona?" &mdash; pergunte "minha organiza&ccedil;&atilde;o est&aacute; pronta para agentes?"</text>
</svg>