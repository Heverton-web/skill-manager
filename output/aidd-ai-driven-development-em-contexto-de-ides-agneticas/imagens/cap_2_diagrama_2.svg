  <text x="600" y="580" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Agentes consomem 50-100x mais tokens que chat. Todas as plataformas migraram para cr&eacute;ditos.</text>
  <text x="600" y="600" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Efici&ecirc;ncia de tokens &eacute; a nova m&eacute;trica de engenharia cr&iacute;tica.</text>
</svg>