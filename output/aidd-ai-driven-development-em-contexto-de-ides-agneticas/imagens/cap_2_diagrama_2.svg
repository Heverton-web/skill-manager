  <text x="950" y="100" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Aider</text>

  <!-- Linha 1 -->
  <text x="130" y="155" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Racioc&iacute;nio</text>
  <text x="330" y="155" font-size="14" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">5/5</text>
  <text x="500" y="155" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">4/5</text>
