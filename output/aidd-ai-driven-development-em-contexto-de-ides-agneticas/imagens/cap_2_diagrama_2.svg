  <text x="950" y="387" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">L&iacute;der: Flex. + Custo</text>

  <!-- Nota sobre crise de precificação -->
  <rect x="40" y="530" width="1120" height="80" rx="8" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
