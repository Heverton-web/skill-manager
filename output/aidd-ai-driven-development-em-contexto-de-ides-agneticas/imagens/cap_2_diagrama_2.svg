  <text x="330" y="275" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">3/5</text>
  <text x="500" y="275" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">3/5</text>
