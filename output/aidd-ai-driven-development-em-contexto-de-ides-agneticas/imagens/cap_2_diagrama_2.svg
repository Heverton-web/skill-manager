  <text x="330" y="387" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">L&iacute;der: Racioc&iacute;nio + Efic. Tokens</text>
  <rect x="420" y="390" width="160" height="24" rx="4" fill="#e8b94a" opacity="0.15"/>
  <text x="500" y="407" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">L&iacute;der: UX/Edi&ccedil;&atilde;o</text>
  <rect x="580" y="410" width="140" height="24" rx="4" fill="#e8b94a" opacity="0.15"/>
  <text x="650" y="427" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">L&iacute;der: Flex. + Custo</text>
  <rect x="720" y="390" width="160" height="24" rx="4" fill="#e8b94a" opacity="0.15"/>
  <text x="800" y="407" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">L&iacute;der: Enterprise</text>
