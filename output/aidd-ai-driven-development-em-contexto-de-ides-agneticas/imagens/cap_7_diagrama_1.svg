<svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="500" fill="#0f1720"/>
  <text x="600" y="40" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Arquitetura MCP: Host, Client e Server</text>
  <rect x="350" y="70" width="500" height="70" rx="12" fill="#e8b94a" opacity="0.9"/>
  <text x="600" y="105" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">MCP Host (Claude Code / Cursor / VS Code)</text>
  <text x="600" y="125" font-size="11" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">Aplica&ccedil;&atilde;o de IA que coordena sess&otilde;es e gerencia conex&otilde;es</text>
  <line x1="350" y1="140" x2="200" y2="220" stroke="#b9c2cc" stroke-width="2"/>
  <line x1="600" y1="140" x2="600" y2="220" stroke="#b9c2cc" stroke-width="2"/>
  <line x1="850" y1="140" x2="1000" y2="220" stroke="#b9c2cc" stroke-width="2"/>
  <rect x="60" y="220" width="280" height="60" rx="8" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <text x="200" y="250" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Client A &harr; Server A (Filesystem)</text>
  <text x="200" y="268" font-size="10" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Transporte: STDIO (local, zero overhead)</text>
  <rect x="460" y="220" width="280" height="60" rx="8" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <text x="600" y="250" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Client B &harr; Server B (Banco SQL)</text>
  <text x="600" y="268" font-size="10" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Transporte: STDIO (local, query seguro)</text>
  <rect x="860" y="220" width="280" height="60" rx="8" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <text x="1000" y="250" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Client C &harr; Server C (API Externa)</text>
  <text x="1000" y="268" font-size="10" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Transporte: HTTP SSE (remoto, OAuth)</text>
  <line x1="200" y1="280" x2="200" y2="350" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="600" y1="280" x2="600" y2="350" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="1000" y1="280" x2="1000" y2="350" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="5,5"/>
  <rect x="60" y="350" width="280" height="50" rx="8" fill="#1c2a3a" stroke="#e8b94a" stroke-width="1"/>
  <text x="200" y="380" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Arquivos, Git, Metadados</text>
  <rect x="460" y="350" width="280" height="50" rx="8" fill="#1c2a3a" stroke="#e8b94a" stroke-width="1"/>
  <text x="600" y="380" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Queries, Schemas, Migra&ccedil;&otilde;es</text>
  <rect x="860" y="350" width="280" height="50" rx="8" fill="#1c2a3a" stroke="#e8b94a" stroke-width="1"/>
  <text x="1000" y="380" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Slack, Jira, GitHub, Notion</text>
  <text x="600" y="460" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Cada servidor MCP exp&otilde;e Tools, Resources e Prompts via JSON-RPC 2.0</text>
  <text x="600" y="480" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"USB-C para IA" &mdash; um padr&atilde;o &uacute;nico que conecta qualquer agente a qualquer ferramenta</text>
</svg>