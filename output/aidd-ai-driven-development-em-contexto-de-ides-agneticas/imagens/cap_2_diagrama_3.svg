<svg viewBox="0 0 1200 550" width="1200" height="550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="setaP" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e8b94a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="550" fill="#0f1720"/>
  <text x="600" y="40" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Matriz de Decis&atilde;o: Qual Coding Agent Escolher?</text>

  <!-- Perfil 1 -->
  <rect x="60" y="70" width="250" height="100" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="185" y="95" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">PERFIL 1</text>
  <text x="185" y="115" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Solo / Produtividade</text>
  <text x="185" y="138" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Dev individual, foco em</text>
  <text x="185" y="156" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">velocidade de entrega</text>
  <line x1="310" y1="120" x2="350" y2="120" stroke="#e8b94a" stroke-width="2" marker-end="url(#setaP)"/>
  <rect x="350" y="90" width="180" height="60" rx="10" fill="#e8b94a" opacity="0.9"/>
  <text x="440" y="120" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#0f1720" text-anchor="middle">Cursor</text>
  <text x="440" y="140" font-size="11" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">ou Claude Code</text>

  <!-- Perfil 2 -->
  <rect x="60" y="200" width="250" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="185" y="225" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">PERFIL 2</text>
  <text x="185" y="245" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Enterprise / Compliance</text>
  <text x="185" y="268" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Equipe m&eacute;dia/grande,</text>
  <text x="185" y="286" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">governan&ccedil;a e seguran&ccedil;a</text>
  <line x1="310" y1="250" x2="350" y2="250" stroke="#b9c2cc" stroke-width="2" marker-end="url(#setaP)"/>
  <rect x="350" y="220" width="180" height="60" rx="10" fill="#3a4a5a"/>
  <text x="440" y="248" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Copilot</text>
  <text x="440" y="268" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">+ Cline c/ MCPs internos</text>

  <!-- Perfil 3 -->
  <rect x="630" y="70" width="250" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="755" y="95" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">PERFIL 3</text>
  <text x="755" y="115" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Privacidade / Controle</text>
  <text x="755" y="138" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Dados sens&iacute;veis, modelos</text>
  <text x="755" y="156" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">locais, BYOM</text>
  <line x1="880" y1="120" x2="920" y2="120" stroke="#b9c2cc" stroke-width="2" marker-end="url(#setaP)"/>
  <rect x="920" y="90" width="180" height="60" rx="10" fill="#3a4a5a"/>
  <text x="1010" y="120" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Cline + Ollama</text>
  <text x="1010" y="140" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Modelos locais</text>

  <!-- Perfil 4 -->
  <rect x="630" y="200" width="250" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="755" y="225" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">PERFIL 4</text>
  <text x="755" y="245" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Automa&ccedil;&atilde;o Ass&iacute;ncrona</text>
  <text x="755" y="268" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Delegar issues, PRs</text>
  <text x="755" y="286" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">autom&aacute;ticos, revis&atilde;o</text>
  <line x1="880" y1="250" x2="920" y2="250" stroke="#b9c2cc" stroke-width="2" marker-end="url(#setaP)"/>
  <rect x="920" y="220" width="180" height="60" rx="10" fill="#3a4a5a"/>
  <text x="1010" y="248" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Devin / Copilot WS</text>
  <text x="1010" y="268" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Sandbox em nuvem</text>

  <!-- Fator comum -->
  <rect x="200" y="370" width="800" height="70" rx="35" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="600" y="400" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Fator comum: Arquivos de Instru&ccedil;&atilde;o Port&aacute;teis</text>
  <text x="600" y="422" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">AGENTS.md &bull; CLAUDE.md &bull; .cursor/rules/*.mdc &bull; MCP</text>

  <!-- Nota -->
  <text x="600" y="490" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&atilde;o existe ferramenta superior em absoluto &mdash; existe a ferramenta certa para cada contexto.</text>
  <text x="600" y="515" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Avalie: tipo de tarefa, tamanho da equipe, requisitos de compliance e or&ccedil;amento.</text>
</svg>