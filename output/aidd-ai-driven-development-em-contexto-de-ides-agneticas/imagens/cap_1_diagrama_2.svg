  <rect x="60" y="110" width="80" height="480" rx="5" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <rect x="145" y="110" width="70" height="480" rx="5" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
