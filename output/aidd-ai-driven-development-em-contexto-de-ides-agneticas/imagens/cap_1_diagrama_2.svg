  <text x="650" y="155" font-size="12" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">15%</text>
  <text x="650" y="175" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Coordena&ccedil;&atilde;o</text>
  <!-- Implementação (pequena) -->
  <rect x="690" y="110" width="80" height="100" rx="5" fill="#3a4a5a"/>
  <text x="730" y="165" font-size="12" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">20%</text>
  <text x="730" y="185" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Implementa&ccedil;&atilde;o</text>
  <text x="730" y="205" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">(agente faz)</text>
  <!-- Testes -->
  <rect x="775" y="110" width="60" height="50" rx="5" fill="#3a4a5a"/>
  <text x="805" y="145" font-size="12" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">10%</text>
  <text x="805" y="165" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Testes</text>

  <!-- Impacto -->
  <text x="600" y="450" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Impacto na aloca&ccedil;&atilde;o de esfor&ccedil;o do desenvolvedor</text>
  <text x="600" y="480" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Implementa&ccedil;&atilde;o cai de 50% &rarr; 20% &bull; Planejamento sobe de 15% &rarr; 55%</text>
  <text x="600" y="510" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Novo gargalo: clareza da inten&ccedil;&atilde;o humana (Intent Bottleneck)</text>

  <!-- Habilidades -->
  <text x="300" y="560" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Habilidades que se desvalorizam: digita&ccedil;&atilde;o r&aacute;pida, memoriza&ccedil;&atilde;o de APIs</text>
  <text x="900" y="560" font-size="12" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">Habilidades que se valorizam: especifica&ccedil;&atilde;o, leitura cr&iacute;tica, verifica&ccedil;&atilde;o</text>
