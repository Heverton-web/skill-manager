  <text x="260" y="270" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Implementa&ccedil;&atilde;o</text>
  <text x="260" y="290" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">(GARGALO)</text>
  <!-- Testes -->
  <rect x="305" y="110" width="55" height="50" rx="5" fill="#3a4a5a"/>
  <text x="332" y="145" font-size="12" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">15%</text>
  <text x="332" y="165" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Testes</text>

