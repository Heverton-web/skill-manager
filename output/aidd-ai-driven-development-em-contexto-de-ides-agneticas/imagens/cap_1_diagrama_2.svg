  <text x="600" y="45" font-size="24" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">A Invers&atilde;o do Gargalo: Execution &rarr; Intent Bottleneck</text>

  <!-- ANTES -->
