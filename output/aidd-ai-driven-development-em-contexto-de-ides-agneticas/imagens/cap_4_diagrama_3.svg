<svg viewBox="0 0 1200 500" width="1200" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="500" fill="#0f1720"/>
  <text x="600" y="35" font-size="20" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Anti-Patterns do Context Engineering: N&atilde;o Fa&ccedil;a vs. Fa&ccedil;a</text>

  <!-- Anti-pattern 1 -->
  <rect x="60" y="55" width="340" height="200" rx="10" fill="#1c2a3a"/>
  <text x="230" y="80" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">1. Duplica&ccedil;&atilde;o de Regras</text>
  
  <rect x="80" y="100" width="140" height="70" rx="6" fill="#3a1a1a" stroke="#e85a5a" stroke-width="1"/>
  <text x="150" y="125" font-size="11" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">N&Atilde;O FA&Ccedil;A</text>
  <text x="150" y="145" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">C&oacute;pia em 4 arquivos</text>
  <text x="150" y="160" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">S&oacute; atualiza 1 deles</text>

  <rect x="240" y="100" width="140" height="70" rx="6" fill="#1a3a1a" stroke="#4a8a4a" stroke-width="1"/>
  <text x="310" y="125" font-size="11" font-family="Arial, sans-serif" fill="#4a8a4a" text-anchor="middle">FA&Ccedil;A</text>
  <text x="310" y="145" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">1 &uacute;nica fonte (AGENTS.md)</text>
  <text x="310" y="160" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Symlinks/hardlinks</text>

  <text x="230" y="215" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Risco: regras dessincronizadas</text>
  <text x="230" y="235" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Solu&ccedil;&atilde;o: git + script de setup</text>

  <!-- Anti-pattern 2 -->
  <rect x="430" y="55" width="340" height="200" rx="10" fill="#1c2a3a"/>
  <text x="600" y="80" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">2. Wishlists Abstratas</text>

  <rect x="450" y="100" width="140" height="70" rx="6" fill="#3a1a1a" stroke="#e85a5a" stroke-width="1"/>
  <text x="520" y="125" font-size="11" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">N&Atilde;O FA&Ccedil;A</text>
  <text x="520" y="145" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">"Escreva c&oacute;digo limpo"</text>
  <text x="520" y="160" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">"Evite bugs"</text>

  <rect x="610" y="100" width="140" height="70" rx="6" fill="#1a3a1a" stroke="#4a8a4a" stroke-width="1"/>
  <text x="680" y="125" font-size="11" font-family="Arial, sans-serif" fill="#4a8a4a" text-anchor="middle">FA&Ccedil;A</text>
  <text x="680" y="145" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">"Rode lint antes de concluir"</text>
  <text x="680" y="160" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">"Fun&ccedil;&otilde;es < 30 linhas"</text>

  <text x="600" y="215" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Risco: agente n&atilde;o sabe o que &eacute; "limpo"</text>
  <text x="600" y="235" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Solu&ccedil;&atilde;o: especifica&ccedil;&otilde;es execut&aacute;veis</text>

  <!-- Anti-pattern 3 -->
  <rect x="800" y="55" width="340" height="200" rx="10" fill="#1c2a3a"/>
  <text x="970" y="80" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">3. Polui&ccedil;&atilde;o de Tokens</text>

  <rect x="820" y="100" width="140" height="70" rx="6" fill="#3a1a1a" stroke="#e85a5a" stroke-width="1"/>
  <text x="890" y="125" font-size="11" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">N&Atilde;O FA&Ccedil;A</text>
  <text x="890" y="145" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Docs inline gigantes</text>
  <text x="890" y="160" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Outputs de comando enormes</text>

  <rect x="980" y="100" width="140" height="70" rx="6" fill="#1a3a1a" stroke="#4a8a4a" stroke-width="1"/>
  <text x="1050" y="125" font-size="11" font-family="Arial, sans-serif" fill="#4a8a4a" text-anchor="middle">FA&Ccedil;A</text>
  <text x="1050" y="145" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Skills sob demanda</text>
  <text x="1050" y="160" font-size="10" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">MCP para consultas</text>

  <text x="970" y="215" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Risco: desperd&iacute;cio de contexto</text>
  <text x="970" y="235" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Ideal: 500-2000 tokens</text>

  <!-- Dica final -->
  <rect x="120" y="280" width="960" height="80" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="600" y="310" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Regra de Ouro do Context Engineering</text>
  <text x="600" y="340" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Pergunte: "O agente precisa disso para tomar a pr&oacute;xima decis&atilde;o?" Se n&atilde;o, remova.</text>
</svg>