<svg viewBox="0 0 1200 550" width="1200" height="550" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="550" fill="#0f1720"/>
  <text x="600" y="40" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Perception Gap: Percep&ccedil;&atilde;o vs. Realidade (Estudo METR)</text>

  <!-- Eixos -->
  <line x1="100" y1="420" x2="1100" y2="420" stroke="#3a4a5a" stroke-width="2"/>
  <text x="600" y="450" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Tarefas rotineiras &larr; &rarr; Tarefas complexas</text>
  <line x1="600" y1="100" x2="600" y2="420" stroke="#3a4a5a" stroke-width="2"/>
  <text x="600" y="85" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Ganho real de produtividade</text>

  <!-- Linha de referência (0) -->
  <line x1="100" y1="300" x2="1100" y2="300" stroke="#3a4a5a" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="1100" y="305" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="end">0% (neutro)</text>

  <!-- Área perception gap -->
  <path d="M 200,250 C 400,200 600,200 800,360 C 900,420 1000,420 1050,400 C 1050,400 1000,340 900,280 C 800,220 600,120 400,180 C 250,220 200,250 200,250 Z" fill="#2a5a7a" opacity="0.3"/>

  <!-- Linha percepção -->
  <path d="M 200,250 C 400,180 600,180 800,340 C 900,400 1000,400 1050,380" fill="none" stroke="#e8b94a" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="450" y="140" font-size="14" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">Percep&ccedil;&atilde;o dos devs</text>
  <text x="450" y="160" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">"Estou 20% mais r&aacute;pido"</text>

  <!-- Linha realidade -->
  <path d="M 200,260 C 400,220 600,240 800,380 C 900,430 1000,435 1050,420" fill="none" stroke="#e85a5a" stroke-width="3"/>
  <text x="870" y="170" font-size="14" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">Realidade medida</text>
  <text x="870" y="190" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">"19% mais lento (complexas)"</text>

  <!-- Perception gap label -->
  <line x1="680" y1="280" x2="680" y2="340" stroke="#e8b94a" stroke-width="2"/>
  <line x1="640" y1="340" x2="720" y2="340" stroke="#e8b94a" stroke-width="2"/>
  <text x="680" y="310" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">~40</text>
  <text x="680" y="328" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">pts gap</text>

  <!-- Dados -->
  <rect x="60" y="470" width="1080" height="65" rx="8" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="1"/>
  <text x="200" y="493" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Tarefas rotineiras</text>
  <text x="200" y="513" font-size="13" font-family="Arial, sans-serif" fill="#4a8a4a" text-anchor="middle">25-50% mais r&aacute;pido</text>
  <text x="500" y="493" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Tarefas complexas</text>
  <text x="500" y="513" font-size="13" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">19% mais lento (real)</text>
  <text x="800" y="493" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Confian&ccedil;a na corre&ccedil;&atilde;o</text>
  <text x="800" y="513" font-size="13" font-family="Arial, sans-serif" fill="#e85a5a" text-anchor="middle">85% percebido vs. 62% real</text>
  <text x="1020" y="493" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Evals essenciais</text>
  <text x="1020" y="513" font-size="13" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">Rollback 4x menor</text>
</svg>