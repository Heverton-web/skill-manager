<svg viewBox="0 0 600 750" width="600" height="750" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="600" height="750" fill="#0f1720"/>
  <text x="300" y="35" font-size="20" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">6 Camadas do Context Engineering</text>

  <!-- Camada 6 -->
  <rect x="80" y="55" width="440" height="100" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="300" y="80" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">6. Information Ordering (Bookending)</text>
  <text x="300" y="102" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Combate ao efeito "Lost in the Middle"</text>
  <text x="300" y="120" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Cr&iacute;tico no in&iacute;cio e final do contexto</text>
  <text x="300" y="140" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Mant&eacute;m foco do agente na tarefa</text>

  <!-- Camada 5 -->
  <rect x="80" y="165" width="440" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="300" y="190" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">5. Context Compression</text>
  <text x="300" y="212" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Rolling windows, sumariza&ccedil;&atilde;o progressiva</text>
  <text x="300" y="230" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Evita estouro de janela de contexto</text>
  <text x="300" y="250" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Mant&eacute;m apenas as N a&ccedil;&otilde;es recentes</text>

  <!-- Camada 4 -->
  <rect x="80" y="275" width="440" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="300" y="300" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">4. Memory Systems</text>
  <text x="300" y="322" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Mem&oacute;ria epis&oacute;dica, RTK Scratchpad</text>
  <text x="300" y="340" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Persist&ecirc;ncia de decis&otilde;es entre sess&otilde;es</text>
  <text x="300" y="360" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&atilde;o repete erros j&aacute; resolvidos</text>

  <!-- Camada 3 -->
  <rect x="80" y="385" width="440" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="300" y="410" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">3. Tool Selection</text>
  <text x="300" y="432" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Expor ferramentas certas por fase</text>
  <text x="300" y="450" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Leitura no planejamento, escrita na execu&ccedil;&atilde;o</text>
  <text x="300" y="470" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Menos ferramentas = melhor racioc&iacute;nio</text>

  <!-- Camada 2 -->
  <rect x="80" y="495" width="440" height="100" rx="10" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="300" y="520" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">2. RAG de C&oacute;digo</text>
  <text x="300" y="542" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Chunking estrutural, hybrid search</text>
  <text x="300" y="560" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Dependency hydration autom&aacute;tica</text>
  <text x="300" y="580" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Recupera&ccedil;&atilde;o precisa de s&iacute;mbolos</text>

  <!-- Camada 1 -->
  <rect x="80" y="605" width="440" height="100" rx="10" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="300" y="630" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">1. System Prompt Architecture</text>
  <text x="300" y="652" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">A base de tudo: pap&eacute;is, restri&ccedil;&otilde;es, formato</text>
  <text x="300" y="670" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Define o contrato fundamental do agente</text>
  <text x="300" y="690" font-size="11" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Sem isso, as outras 5 camadas n&atilde;o funcionam</text>

  <text x="300" y="730" font-size="11" font-family="Arial, sans-serif" fill="#3a4a5a" text-anchor="middle">Construa de baixo para cima &uarr;</text>
</svg>