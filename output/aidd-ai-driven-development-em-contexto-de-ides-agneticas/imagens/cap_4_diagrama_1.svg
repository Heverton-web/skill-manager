<svg viewBox="0 0 1200 400" width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="400" fill="#0f1720"/>
  <text x="600" y="40" font-size="22" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Prompt Engineering vs. Context Engineering</text>

  <!-- Prompt Engineering -->
  <rect x="80" y="65" width="480" height="280" rx="12" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="320" y="95" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Prompt Engineering</text>
  <text x="320" y="120" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">"A arte de escrever a instru&ccedil;&atilde;o perfeita"</text>

  <rect x="110" y="145" width="200" height="80" rx="8" fill="#2a5a7a"/>
  <text x="210" y="175" font-size="14" font-family="Arial, sans-serif" fill="#f5f2ea" text-anchor="middle">Prompt &uacute;nico</text>
  <text x="210" y="198" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Uma mensagem, um resultado</text>
  <text x="210" y="215" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Micro-n&iacute;vel</text>

  <rect x="330" y="145" width="200" height="80" rx="8" fill="#3a4a5a"/>
  <text x="430" y="175" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Escolha de palavras</text>
  <text x="430" y="198" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Framing e contexto</text>
  <text x="430" y="215" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Funciona em chats curtos</text>

  <text x="320" y="280" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Falha em sess&otilde;es longas de agentes</text>
  <text x="320" y="300" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">N&atilde;o escala para coding agents</text>
  <text x="320" y="325" font-size="11" font-family="Arial, sans-serif" fill="#3a4a5a" text-anchor="middle">&Oacute;timo para chat, p&eacute;ssimo para agentes</text>

  <!-- Context Engineering -->
  <rect x="640" y="65" width="480" height="280" rx="12" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="880" y="95" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">Context Engineering</text>
  <text x="880" y="120" font-size="12" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">"A arte de preencher a janela de contexto com a info certa"</text>

  <rect x="670" y="145" width="200" height="80" rx="8" fill="#e8b94a" opacity="0.9"/>
  <text x="770" y="172" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">Sess&atilde;o inteira</text>
  <text x="770" y="195" font-size="11" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">20+ a&ccedil;&otilde;es do agente</text>
  <text x="770" y="212" font-size="11" font-family="Arial, sans-serif" fill="#0f1720" text-anchor="middle">Macro-n&iacute;vel</text>

  <rect x="890" y="145" width="200" height="80" rx="8" fill="#3a4a5a"/>
  <text x="990" y="172" font-size="14" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Arquitetura completa</text>
  <text x="990" y="195" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Regras + RAG + Mem&oacute;ria + MCP</text>
  <text x="990" y="212" font-size="11" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Ordem da informa&ccedil;&atilde;o</text>

  <text x="880" y="280" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Essencial para coding agents</text>
  <text x="880" y="300" font-size="12" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Escala para projetos reais</text>
  <text x="880" y="325" font-size="11" font-family="Arial, sans-serif" fill="#e8b94a" text-anchor="middle">A disciplina central de 2025-2026</text>
</svg>