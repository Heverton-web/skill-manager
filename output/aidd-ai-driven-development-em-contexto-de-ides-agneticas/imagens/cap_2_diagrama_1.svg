<svg viewBox="0 0 1200 700" width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="700" fill="#0f1720"/>
  <text x="600" y="45" font-size="24" font-family="Georgia, serif" font-weight="bold" fill="#f5f2ea" text-anchor="middle">Taxonomia dos Coding Agents (2026)</text>
  <text x="600" y="75" font-size="16" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Classifica&ccedil;&atilde;o por Autonomia e Integra&ccedil;&atilde;o ao Ambiente</text>

  <!-- Eixos -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#3a4a5a" stroke-width="2"/>
  <line x1="600" y1="130" x2="600" y2="550" stroke="#3a4a5a" stroke-width="2"/>
  <text x="1100" y="580" font-size="14" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="end">Autonomia do Agente &rarr;</text>
  <text x="600" y="115" font-size="14" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Integra&ccedil;&atilde;o ao Ambiente &darr;</text>

  <!-- Quadrantes -->
  <!-- Q1: CLI Agents (alta autonomia, baixa integração visual) -->
  <rect x="120" y="150" width="230" height="180" rx="12" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="235" y="180" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">CLI Agents</text>
  <text x="235" y="205" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Claude Code</text>
  <text x="235" y="225" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Aider</text>
  <text x="235" y="245" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Codex CLI</text>
  <text x="235" y="280" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Loop aut&ocirc;nomo total</text>
  <text x="235" y="300" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Terminal puro</text>
  <text x="235" y="320" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Efici&ecirc;ncia de tokens</text>

  <!-- Q2: IDE-Native (alta autonomia, alta integração) -->
  <rect x="370" y="150" width="230" height="180" rx="12" fill="#1c2a3a" stroke="#e8b94a" stroke-width="2"/>
  <text x="485" y="180" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#e8b94a" text-anchor="middle">IDE-Native</text>
  <text x="485" y="205" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Cursor</text>
  <text x="485" y="225" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Windsurf/Devin Desktop</text>
  <text x="485" y="280" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">UX polida, multi-arquivo</text>
  <text x="485" y="300" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Multi-modelo</text>
  <text x="485" y="320" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Contexto m&eacute;dio</text>

  <!-- Q3: Extensions (baixa autonomia, alta integração) -->
  <rect x="370" y="350" width="230" height="180" rx="12" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="485" y="380" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">IDE Extensions</text>
  <text x="485" y="405" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Cline (BYOM)</text>
  <text x="485" y="425" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">GitHub Copilot</text>
  <text x="485" y="480" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Flexibilidade total</text>
  <text x="485" y="500" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Dentro do editor host</text>

  <!-- Q4: Cloud Agents (baixa autonomia, baixa integração) -->
  <rect x="120" y="350" width="230" height="180" rx="12" fill="#1c2a3a" stroke="#3a4a5a" stroke-width="2"/>
  <text x="235" y="380" font-size="16" font-family="Georgia, serif" font-weight="bold" fill="#b9c2cc" text-anchor="middle">Cloud Agents</text>
  <text x="235" y="405" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Devin (Cognition)</text>
  <text x="235" y="425" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Copilot Workspace</text>
  <text x="235" y="445" font-size="13" font-family="Arial, sans-serif" fill="#b9c2cc" text-anchor="middle">Jules (Google)</text>
  <text x="235" y="480" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Ass&iacute;ncrono</text>
  <text x="235" y="500" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Sandbox em nuvem</text>
  <text x="235" y="520" font-size="12" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">PRs autom&aacute;ticos</text>

  <!-- MCP label -->
  <rect x="650" y="600" width="200" height="50" rx="25" fill="#e8b94a" opacity="0.9"/>
  <text x="750" y="630" font-size="14" font-family="Arial, sans-serif" font-weight="bold" fill="#0f1720" text-anchor="middle">MCP: Fator Transversal</text>
  <line x1="750" y1="600" x2="485" y2="550" stroke="#e8b94a" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="650" y="675" font-size="13" font-family="Arial, sans-serif" fill="#6a7a8a" text-anchor="middle">Model Context Protocol conecta todas as categorias</text>
</svg>